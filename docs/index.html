<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andon designförslag</title><style>body{font:16px system-ui;background:#eef2f6;color:#142538;margin:0}header{background:#142538;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}button,select,textarea{font:inherit;border-radius:12px;padding:12px}button{border:0;background:#17466b;color:white;font-weight:700;cursor:pointer}main{max-width:950px;margin:auto;padding:16px}.tabs button{background:#415a70}.tabs .on{background:#f3bc39;color:#132333}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid button{height:170px;font-size:27px}.material{background:#2876d2}.stall{background:#d88b1e}.kvalitet{background:#ce3e49}.hjalp{background:#7754b7}.panel{background:white;border-radius:16px;padding:18px;margin:14px 0}.item{border-bottom:1px solid #ddd;padding:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.deny{background:#c63838}textarea{width:90%;height:55px;margin:8px 0}.notice{background:#ffe4e4;border:2px solid #d33;padding:15px;border-radius:14px}select{background:white;border:1px solid #ccc;width:100%;margin-bottom:14px}.small{color:#667}#phone{max-width:440px;margin:auto}#phone .panel{box-shadow:0 6px 20px #0001}@media(max-width:550px){.grid button{height:145px;font-size:21px}header{flex-wrap:wrap;gap:10px}}</style><header><strong>🚨 ANDON · Designförslag</strong><span class="tabs"><button id="opTab" class="on" onclick="switchView('op')">iPad · Operatör</button> <button id="mgTab" onclick="switchView('mg')">Telefon · Ansvarig</button></span></header><main><div id="op"><select id="station"><option>Limhjul 3</option><option>Limhjul 4</option></select><div id="notice"></div><div class="grid"><button class="material" onclick="alarm('Material')">📦<p>Material</p></button><button class="stall" onclick="alarm('Ställ')">🔧<p>Ställ</p></button><button class="kvalitet" onclick="alarm('Kvalitet')">⚠️<p>Kvalitet</p></button><button class="hjalp" onclick="alarm('Hjälp')">🙋<p>Hjälp</p></button></div><div class="panel"><strong>Aktiva larm på vald station</strong><div id="opAlarms"></div></div></div><div id="phone" hidden><div class="panel"><h2>Ansvarig</h2><p class="small">Simulerade inkommande larm · Limhjul 3 och 4</p><div id="mgAlarms"></div></div><div class="panel"><h3>Händelselogg</h3><div id="history"></div></div></div><p class="small">Klickbar demonstration. Larm sparas endast i den här webbläsaren. Ingen synkronisering eller pushnotiser.</p></main><script>let alarms=[];let view='op';let seen=new Set();const $=id=>document.getElementById(id);function switchView(v){view=v;$('op').hidden=v!=='op';$('phone').hidden=v!=='mg';$('opTab').classList.toggle('on',v==='op');$('mgTab').classList.toggle('on',v==='mg');render()}function alarm(type){alarms.unshift({id:Date.now()+Math.random(),station:$('station').value,type,created:Date.now(),status:'Aktivt',comment:''});render()}function handle(id,status){let a=alarms.find(x=>x.id===id);a.status=status;a.comment=$('c'+id)?.value||'';a.duration=Math.round((Date.now()-a.created)/1000);render()}function render(){let station=$('station').value;let active=alarms.filter(a=>a.status==='Aktivt');$('opAlarms').innerHTML=active.filter(a=>a.station===station).map(a=>'<div class="item"><b>'+a.type+'</b> · '+a.station+' <button onclick="handle('+a.id+',\'Kvitterat\')">Kvittera</button></div>').join('')||'<p class="small">Inga aktiva larm</p>';$('mgAlarms').innerHTML=active.map(a=>'<div class="item"><b>'+a.type+'</b> · '+a.station+'<p class="small">Väntar på åtgärd</p><textarea id="c'+a.id+'" placeholder="Kommentar (valfritt)"></textarea><div class="actions"><button onclick="handle('+a.id+',\'Kvitterat\')">Kvittera</button><button class="deny" onclick="handle('+a.id+',\'Nekat\')">Neka</button></div></div>').join('')||'<p class="small">Inga aktiva larm</p>';$('history').innerHTML=alarms.filter(a=>a.status!=='Aktivt').map(a=>'<div class="item"><b>'+a.type+'</b> · '+a.station+' · '+a.status+' · '+a.duration+' s'+(a.comment?'<p>'+a.comment.replaceAll('<','&lt;')+'</p>':'')+'</div>').join('')||'<p class="small">Ingen historik</p>';let denied=alarms.find(a=>a.station===station&&a.status==='Nekat'&&!seen.has(a.id));$('notice').innerHTML=denied?'<div class="notice"><b>Larm nekat: '+denied.type+'</b><p>'+denied.comment.replaceAll('<','&lt;')+'</p><button onclick="seen.add('+denied.id+');render()">OK</button></div>':''}$('station').onchange=render;render();</script></html>
