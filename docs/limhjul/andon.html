<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><title>Andon · Limhjul</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font:15px system-ui,Arial}header{padding:16px;background:#111827;border-bottom:1px solid #35435b;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}main{max-width:1180px;margin:auto;padding:16px}.panel{background:#111827;border:1px solid #35435b;border-radius:12px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#192942;border:1px solid #35435b;border-radius:10px;padding:22px;color:white;text-decoration:none;font-weight:750;display:block}button,select,input,textarea{font:inherit;border-radius:8px;padding:10px;background:#17243a;color:white;border:1px solid #41516c}button{cursor:pointer}button.primary,.primary{background:#3d61ea;border-color:#3d61ea}h1{font-size:22px}h2{font-size:18px}small,.muted{color:#9bb5d5}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:10px}}.alarms button{min-height:120px;font-size:21px}.item{padding:12px;border-bottom:1px solid #35435b}/* Anpassning för operatör i liggande läge och ansvarig i stående */
#op .op-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}#op .op-head h2{margin:5px 0}#op .station-label{font-size:11px;color:#9bb5d5;font-weight:700;min-width:190px}#op .station-label select{display:block;width:100%;margin-top:5px}#op .op-columns{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(220px,0.85fr);gap:16px}#op .alarms{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#op .alarms button{min-height:clamp(100px,24vh,190px);font-size:clamp(18px,2.4vw,28px);font-weight:750}#op .active-panel{border-left:1px solid #35435b;padding-left:16px;min-width:0}#op .active-panel h2{margin-top:0}#mg{max-width:520px;margin:12px auto}#mg .item{padding:14px 0}#mg textarea{display:block;width:100%;min-height:66px;resize:vertical}#mg .item button{min-height:48px;padding:11px 18px;margin:3px 5px 3px 0}#mg .history-panel{border-top:1px solid #35435b;margin-top:18px;padding-top:8px}#mg h2{margin:10px 0 14px}@media(orientation:landscape) and (min-width:700px){body:has(#op:not(.hidden)) main{max-width:1400px}body:has(#op:not(.hidden)) header{padding:9px 16px}body:has(#op:not(.hidden)) main{padding:8px 14px}body:has(#op:not(.hidden)) #op{margin:8px 0;padding:12px 16px}body:has(#op:not(.hidden)) #op .alarms button{min-height:clamp(100px,26vh,190px)}}@media(max-width:700px), (orientation:portrait){#op .op-columns{grid-template-columns:1fr}#op .active-panel{border-left:0;border-top:1px solid #35435b;padding:10px 0 0}#op .alarms{grid-template-columns:repeat(2,minmax(0,1fr))}#op .alarms button{min-height:110px;font-size:18px}#op .op-head{align-items:center}#op .station-label{min-width:125px}#mg{max-width:540px}}@media(max-width:360px){#op .op-head{flex-wrap:wrap}}
</style></head><body><header><div><a href="./" style="color:#a4c7ff">← Startsida</a> <strong> · Andon</strong></div><button id="install" class="primary">Installera app</button><script>let installEvent;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});document.getElementById('install').onclick=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null}else alert(/iPad|iPhone|iPod/.test(navigator.userAgent)?'Öppna i Safari, tryck på Dela och välj Lägg till på hemskärmen.':'Öppna webbläsarens meny och välj Installera app eller Lägg till på startskärmen.')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></header><main><div class="bar"><button id="operator" class="primary" onclick="switchTab('op')">iPad · Operatör</button><button id="manager" onclick="switchTab('mg')">Telefon · Ansvarig</button></div><div id="op" class="panel"><div class="op-head"><div><small>OPERATÖR · LIGGANDE LÄGE</small><h2>Begär hjälp</h2></div><label class="station-label">STATION <select id="station"><option>Limhjul 3</option><option selected>Limhjul 4</option></select></label></div><div class="op-columns"><div><div id="notice"></div><div class="grid alarms"><button onclick="alarm('Material')">▣ Material</button><button onclick="alarm('Ställ')">⚙ Ställ</button><button onclick="alarm('Kvalitet')">◆ Kvalitet</button><button onclick="alarm('Hjälp')">✋ Hjälp</button></div></div><div class="active-panel"><h2>Aktiva larm</h2><div id="opList"></div></div></div></div><div id="mg" class="panel hidden"><small>ANSVARIG · STÅENDE LÄGE</small><h2>Inkommande larm</h2><div id="mgList"></div><section class="history-panel"><h2>Händelselogg</h2><div id="history"></div></section></div><p class="muted">Demonstration: larm syns bara i den här öppna sidan. Ingen synkronisering eller pushnotiser.</p></main><script>let alarms=[],tab='op';const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function switchTab(t){tab=t;$('op').classList.toggle('hidden',t!=='op');$('mg').classList.toggle('hidden',t!=='mg');$('operator').classList.toggle('primary',t==='op');$('manager').classList.toggle('primary',t==='mg');render()}function alarm(type){alarms.unshift({id:Date.now(),type,station:$('station').value,time:Date.now(),status:'Aktivt',comment:''});render()}function finish(id,status){let a=alarms.find(x=>x.id===id);if(!a)return;a.status=status;a.comment=$('c'+id)?.value||'';a.duration=Math.round((Date.now()-a.time)/1000);render()}function render(){let active=alarms.filter(a=>a.status==='Aktivt');$('opList').innerHTML=active.filter(a=>a.station===$('station').value).map(a=>'<div class="item">'+esc(a.type)+' · '+esc(a.station)+' <button onclick="finish('+a.id+',\'Kvitterat\')">Kvittera</button></div>').join('')||'<p class="muted">Inga aktiva larm.</p>';$('mgList').innerHTML=active.map(a=>'<div class="item"><b>'+esc(a.type)+' · '+esc(a.station)+'</b><p><textarea id="c'+a.id+'" placeholder="Kommentar"></textarea></p><button class="primary" onclick="finish('+a.id+',\'Kvitterat\')">Kvittera</button> <button onclick="finish('+a.id+',\'Nekat\')">Neka</button></div>').join('')||'<p class="muted">Inga aktiva larm.</p>';$('history').innerHTML=alarms.filter(a=>a.status!=='Aktivt').map(a=>'<div class="item">'+esc(a.type)+' · '+esc(a.station)+' · '+esc(a.status)+' · '+a.duration+' sek <p>'+esc(a.comment)+'</p></div>').join('')||'<p class="muted">Ingen historik.</p>';$('notice').innerHTML=alarms.filter(a=>a.status==='Nekat'&&a.station===$('station').value).slice(0,1).map(a=>'<p style="color:#f99">Larm nekat: '+esc(a.type)+' '+esc(a.comment)+'</p>').join('')}$('station').onchange=render;render()</script></body></html>
