<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><title>Andon · Limhjul</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font:15px system-ui,Arial}header{padding:16px;background:#111827;border-bottom:1px solid #35435b;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}main{max-width:1180px;margin:auto;padding:16px}.panel{background:#111827;border:1px solid #35435b;border-radius:12px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#192942;border:1px solid #35435b;border-radius:10px;padding:22px;color:white;text-decoration:none;font-weight:750;display:block}button,select,input,textarea{font:inherit;border-radius:8px;padding:10px;background:#17243a;color:white;border:1px solid #41516c}button{cursor:pointer}button.primary,.primary{background:#3d61ea;border-color:#3d61ea}h1{font-size:22px}h2{font-size:18px}small,.muted{color:#9bb5d5}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:10px}}.alarms button{min-height:120px;font-size:21px}.item{padding:12px;border-bottom:1px solid #35435b}</style></head><body><header><div><a href="./" style="color:#a4c7ff">← Startsida</a> <strong> · Andon</strong></div><button id="install" class="primary">Installera app</button><script>let installEvent;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});document.getElementById('install').onclick=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null}else alert(/iPad|iPhone|iPod/.test(navigator.userAgent)?'Öppna i Safari, tryck på Dela och välj Lägg till på hemskärmen.':'Öppna webbläsarens meny och välj Installera app eller Lägg till på startskärmen.')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></header><main><div class="bar"><button id="operator" class="primary" onclick="switchTab('op')">iPad · Operatör</button><button id="manager" onclick="switchTab('mg')">Telefon · Ansvarig</button></div><div id="op" class="panel"><small>OPERATÖR</small><h2>Begär hjälp</h2><select id="station"><option>Limhjul 3</option><option selected>Limhjul 4</option></select><div id="notice"></div><div class="grid alarms"><button onclick="alarm('Material')">▣ Material</button><button onclick="alarm('Ställ')">⚙ Ställ</button><button onclick="alarm('Kvalitet')">◆ Kvalitet</button><button onclick="alarm('Hjälp')">✋ Hjälp</button></div><h2>Aktiva larm</h2><div id="opList"></div></div><div id="mg" class="panel hidden"><small>ANSVARIG</small><h2>Inkommande larm</h2><div id="mgList"></div><h2>Händelselogg</h2><div id="history"></div></div><p class="muted">Demonstration: larm syns bara i den här öppna sidan. Ingen synkronisering eller pushnotiser.</p></main><script>let alarms=[],tab='op';const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function switchTab(t){tab=t;$('op').classList.toggle('hidden',t!=='op');$('mg').classList.toggle('hidden',t!=='mg');$('operator').classList.toggle('primary',t==='op');$('manager').classList.toggle('primary',t==='mg');render()}function alarm(type){alarms.unshift({id:Date.now(),type,station:$('station').value,time:Date.now(),status:'Aktivt',comment:''});render()}function finish(id,status){let a=alarms.find(x=>x.id===id);if(!a)return;a.status=status;a.comment=$('c'+id)?.value||'';a.duration=Math.round((Date.now()-a.time)/1000);render()}function render(){let active=alarms.filter(a=>a.status==='Aktivt');$('opList').innerHTML=active.filter(a=>a.station===$('station').value).map(a=>'<div class="item">'+esc(a.type)+' · '+esc(a.station)+' <button onclick="finish('+a.id+',\'Kvitterat\')">Kvittera</button></div>').join('')||'<p class="muted">Inga aktiva larm.</p>';$('mgList').innerHTML=active.map(a=>'<div class="item"><b>'+esc(a.type)+' · '+esc(a.station)+'</b><p><textarea id="c'+a.id+'" placeholder="Kommentar"></textarea></p><button class="primary" onclick="finish('+a.id+',\'Kvitterat\')">Kvittera</button> <button onclick="finish('+a.id+',\'Nekat\')">Neka</button></div>').join('')||'<p class="muted">Inga aktiva larm.</p>';$('history').innerHTML=alarms.filter(a=>a.status!=='Aktivt').map(a=>'<div class="item">'+esc(a.type)+' · '+esc(a.station)+' · '+esc(a.status)+' · '+a.duration+' sek <p>'+esc(a.comment)+'</p></div>').join('')||'<p class="muted">Ingen historik.</p>';$('notice').innerHTML=alarms.filter(a=>a.status==='Nekat'&&a.station===$('station').value).slice(0,1).map(a=>'<p style="color:#f99">Larm nekat: '+esc(a.type)+' '+esc(a.comment)+'</p>').join('')}$('station').onchange=render;render()</script></body></html>
