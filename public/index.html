<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12263a"><link rel="manifest" href="/manifest.json"><title>ANDON</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f2f5f9;color:#14283d}header{background:#12263a;color:white;padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0;font-size:25px}main{max-width:800px;margin:24px auto;padding:0 14px}button,select,textarea,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:12px;background:#183c5a;color:white;font-weight:700}nav button{background:#34516b}nav .selected{background:#f9c846;color:#162c40}select{padding:12px;width:100%;border:1px solid #ccd2db;border-radius:10px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.alarm{min-height:185px;border-radius:16px;font-weight:800;font-size:27px;color:white}.material{background:#2563eb}.stall{background:#c57c13}.kvalitet{background:#d63d40}.hjalp{background:#7651bd}.panel{background:white;border-radius:14px;padding:18px;margin-top:18px}.entry{padding:14px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#637084;font-size:14px}.hidden{display:none}.notice{background:#fee2e2;border:2px solid #dc2626;border-radius:14px;padding:18px;margin-bottom:16px}.notice h2{color:#b91c1c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:200px}.actions textarea{grid-column:span 2;min-height:52px}.deny{background:#c62828}.comment{background:#f0f3f7;padding:8px;border-radius:6px}.setting{display:flex;gap:8px;flex-wrap:wrap}.setting input{padding:9px;max-width:190px}#message{padding:14px;color:#a33112}@media(max-width:480px){header{flex-wrap:wrap}.alarm{min-height:155px;font-size:23px}.entry{align-items:stretch;flex-direction:column}.actions{width:100%}}</style></head><body><header><h1>🚨 ANDON</h1><nav><button id="operatorTab" class="selected">Operatör</button> <button id="managerTab">Ansvarig</button></nav></header><main><section id="operator"><select id="station" aria-label="Station"><option>Limhjul 3</option><option>Limhjul 4</option></select><div id="rejection" class="notice hidden"><h2>LARM NEKAT</h2><p id="rejectionText"></p><button id="dismiss">OK</button></div><div class="grid"><button class="alarm material" data-category="Material">📦<br>Material</button><button class="alarm stall" data-category="Ställ">🔧<br>Ställ</button><button class="alarm kvalitet" data-category="Kvalitet">⚠️<br>Kvalitet</button><button class="alarm hjalp" data-category="Hjälp">🙋<br>Hjälp</button></div><div id="operatorAlarms"></div></section><section id="manager" class="hidden"><div class="panel"><h2>Ansvarig</h2><p class="muted">Ange ansvarigkod för kvittens, nekande och pushregistrering.</p><div class="setting"><input id="pin" type="password" placeholder="Ansvarigkod"><button id="savePin">Spara kod</button></div><p><button id="enablePush">Aktivera pushnotiser</button></p><p id="pushStatus" class="muted"></p></div><div class="panel"><h2>Aktiva larm</h2><div id="managerAlarms"></div></div><div class="panel"><h2>Händelselogg</h2><div id="closedAlarms"></div></div></section><div id="message" aria-live="polite"></div></main><script src="/app.js"></script></body></html>
